<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auto Paper Maker · AHSA</title>
<meta name="description" content="Make a printable test paper in one minute from AHSA notes: choose class, subject, chapters and marks. MCQs, short and long questions, answer key, Set A/B, English and Urdu medium.">
<meta name="theme-color" content="#0a1222">
<link rel="icon" href="../assets/logo-96.webp">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preload" href="../assets/fonts/jnn-site.woff2?v=1" as="font" type="font/woff2" crossorigin>
<style>
:root{--bg:#f3f6fb;--card:#fff;--soft:#e7eefa;--ink:#0f1b33;--mut:#58647a;--line:#dbe3f0;--navy:#0b3d91;--gold:#ffc107;--em:#0b3d91;--um:#7c3aed;--ok:#15803d;--bad:#dc2626;
--f-body:"Source Sans 3","Segoe UI",system-ui,Roboto,Arial,sans-serif;--f-ur:"AHSA JNN","Jameel Noori Nastaleeq","Noto Nastaliq Urdu","Urdu Typesetting",serif}
@font-face{font-family:"AHSA JNN";src:local("Jameel Noori Nastaleeq"),url(../assets/fonts/jnn-site.woff2?v=1) format("woff2");font-display:swap;size-adjust:115%}
@font-face{font-family:"AHSA JNN Paper";src:local("Jameel Noori Nastaleeq"),url(../assets/fonts/jnn-paper.woff2?v=1) format("woff2");font-display:block;size-adjust:112%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1222;--card:#111c31;--soft:#16233d;--ink:#e6edf9;--mut:#9aa8c2;--line:#24324d;--navy:#0d3f97;--em:#7aa7ff;--um:#b794ff}}
:root[data-theme="dark"]{--bg:#0a1222;--card:#111c31;--soft:#16233d;--ink:#e6edf9;--mut:#9aa8c2;--line:#24324d;--navy:#0d3f97;--em:#7aa7ff;--um:#b794ff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 var(--f-body);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.u{font-family:var(--f-ur);direction:rtl;unicode-bidi:isolate;line-height:2}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.top img{width:40px;height:40px;border-radius:50%;background:#fff}
.top h1{margin:0;font:800 19px/1.15 var(--f-body);flex:1;min-width:0}
.top h1 small{display:block;font:400 15px/1.6 var(--f-ur);opacity:.95}
.ib{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:14px 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(15,27,51,.05),0 6px 18px rgba(15,27,51,.06)}
.steps{display:flex;gap:6px;margin:0 0 12px}
.steps i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.steps i.on{background:var(--gold)}
h2.q{margin:0 0 4px;font:800 22px/1.3 var(--f-body)}
h2.q .u{display:block;font-size:20px;font-weight:400;color:var(--mut)}
.hint{color:var(--mut);font-size:16px;margin:2px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ch{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:start;min-height:64px;width:100%}
.ch b{font-size:19px}
.ch .u{font-size:17px;line-height:1.8}
.ch small{color:var(--mut);font-size:14px}
.ch[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,193,7,.16)}
.ch:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font:700 18px/1.2 var(--f-body);cursor:pointer;text-decoration:none;min-height:50px}
.btn.gold{background:var(--gold);color:#1a1300}
.btn.navy{background:var(--navy);color:#fff}
.btn.line{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.wa{background:#15803d;color:#fff}
.btn.red{background:transparent;color:var(--bad);border:2px solid var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nav2{display:flex;gap:10px;margin-top:14px}
.nav2 .btn{flex:1}
.chl{display:flex;flex-direction:column;gap:8px}
.chi{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;background:var(--soft)}
.chi input{width:26px;height:26px;flex:none;accent-color:#e0a800}
.chi .t{flex:1;min-width:0}
.chi .t b{display:block;font-size:17px;line-height:1.35}
.chi .t small{color:var(--mut);font-size:14px}
.chi.on{border-color:var(--gold)}
.chi[dir="rtl"] .t b{font:400 18px/1.9 var(--f-ur)}
.all{display:flex;gap:12px;align-items:center;font-weight:700;margin-bottom:10px;padding:10px 12px;border-radius:14px;background:rgba(255,193,7,.14)}
.all input{width:26px;height:26px;accent-color:#e0a800}
.set{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set label{font-weight:700}
.set label .u{display:block;font-weight:400;font-size:16px;color:var(--mut)}
.stp{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--soft)}
.stp button{width:46px;height:46px;border:0;background:transparent;font-size:24px;font-weight:800;cursor:pointer;color:var(--ink)}
.stp output{min-width:46px;text-align:center;font-weight:800;font-size:19px}
.sec{border:2px solid var(--line);border-radius:16px;padding:12px;margin:12px 0;background:var(--soft)}
.sec h3{margin:0 0 4px;font-size:19px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec h3 .u{font-weight:400;font-size:17px}
.sec .av{color:var(--mut);font-size:14px}
.sec .set{border-color:var(--line)}
.dif{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.dif>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;font-weight:700}
.dif .stp{width:100%;justify-content:space-between}
.dif .stp button{width:34px;height:40px;font-size:20px}
.dif .stp output{min-width:22px;font-size:17px}
.dif>div{min-width:0}
.tog{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:700;padding:8px 0}
.tog input{width:24px;height:24px;accent-color:#e0a800;flex:none}
.tog .u,.all .u,.note .u,.hint .u{display:block;font-weight:400}
.tot{display:flex;justify-content:space-around;gap:10px;text-align:center;background:var(--navy);color:#fff;border-radius:16px;padding:12px;margin:12px 0}
.tot b{display:block;font-size:26px}
.tot span{font-size:14px;opacity:.9}
.inp{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);font-size:17px}
.num{width:84px;text-align:center}
.warn{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.4);border-radius:12px;padding:10px 12px;font-size:16px;margin:10px 0}
.note{background:rgba(255,193,7,.12);border:1px solid rgba(255,193,7,.5);border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.acts .btn{font-size:16px;padding:12px 10px}
.acts .full{grid-column:1/-1}
.pvw{overflow:hidden;background:#8a94a6;border-radius:14px;padding:10px}
.pvin{transform-origin:top left}
.mp{display:flex;flex-direction:column;gap:10px}
.mpi{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.mpi b{font-size:18px}
.mpi .meta{color:var(--mut);font-size:15px;margin:2px 0 10px}
.mpi .row .btn{flex:1;min-width:0;padding:10px 8px;font-size:15px;min-height:44px}
.cvt{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0 4px}
.cvt th,.cvt td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:end}
.cvt th:first-child,.cvt td:first-child{text-align:start}
.cvt th{font-size:12.5px;color:var(--mut);font-weight:700}
.cvt tr.ct td{font-weight:800;background:var(--soft)}
.cvt small{display:block;color:var(--mut);font-size:11.5px}
.cvbig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.cvbig div{background:var(--navy);color:#fff;border-radius:14px;padding:10px;text-align:center}
.cvbig b{display:block;font-size:22px;color:#ffc107}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.12)}
.bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px 7px;border:0;background:none;text-decoration:none;color:var(--mut);font:700 12.5px/1.15 var(--f-body);min-height:62px;cursor:pointer}
.bnav span.e{font-size:21px;line-height:1.1}
.bnav .u{font-size:12px;line-height:1.5;font-weight:400}
.bnav [aria-current="page"]{color:var(--ink)}
.bnav [aria-current="page"] span.e{background:rgba(255,193,7,.3);border-radius:12px;padding:0 10px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.modal dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:10px 0 16px}
.modal dt{color:var(--mut)}
.modal dd{margin:0;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:16px;max-width:90vw;text-align:center}
.busy{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;padding:20px}
.vis{position:absolute;left:-9999px}
/* ---------- A4 paper ---------- */
#stage{position:absolute;left:-10000px;top:0}
.page{width:794px;height:1123px;background:#fff;color:#000;padding:38px 42px 34px;position:relative;overflow:hidden;font:400 14.5px/1.45 "Times New Roman",Georgia,serif;margin:0 0 12px}
.page[dir="rtl"]{font:400 17px/1.75 "AHSA JNN Paper",var(--f-ur)}
.page[dir="rtl"] .u,.page[dir="rtl"] .sh,.page[dir="rtl"] .ph{font-family:"AHSA JNN Paper",var(--f-ur)}
.page .pf{position:absolute;left:42px;right:42px;bottom:12px;display:flex;justify-content:space-between;font:400 10.5px/1.2 Arial,sans-serif;color:#555;direction:ltr}
.page .body>*{break-inside:avoid}
.ph{border:2px solid #000;border-radius:6px;padding:8px 10px;margin-bottom:10px}
.ph .r1{display:flex;align-items:center;gap:10px}
.ph img{width:58px;height:58px;border-radius:50%}
.ph .nm{flex:1;text-align:center}
.ph .nm b{display:block;font:800 21px/1.15 Georgia,"Times New Roman",serif;text-transform:uppercase;letter-spacing:.3px}
.ph .nm .u{display:block;font-size:17px;line-height:1.7}
.ph .set{display:block;border:2px solid #000;border-radius:6px;padding:4px 8px;font:800 16px/1.2 Arial,sans-serif;text-align:center;min-width:56px}
.ph .r2{text-align:center;font-weight:700;font-size:16px;margin:4px 0 2px}
.ph .r3{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px;border-top:1px solid #000;padding-top:5px;margin-top:4px;flex-wrap:wrap}
.ph .r4{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:6px}
.ph .r4 div{border:1.5px solid #000;border-radius:4px;padding:3px 6px;height:30px;font-size:12.5px;font-weight:700}
.ph .chs{font-size:11.5px;color:#222;margin-top:4px;text-align:center}
.page[dir="rtl"] .ph .r3,.page[dir="rtl"] .ph .r4 div{font-size:15px}
.page[dir="rtl"] .ph .chs{font-size:13px}
.sh{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px;border-bottom:1.5px solid #000;padding:6px 0 3px;margin:6px 0 6px}
.page[dir="rtl"] .sh{font-size:16.5px}
.qi{display:flex;gap:6px;padding:3px 0;position:relative}
.bq{font-weight:700;margin:8px 0 2px}.bq .mk{float:right;font-weight:400}.page[dir="rtl"] .bq .mk{float:left}
.pt{font-weight:700;text-align:center;font-size:15.5px;margin:10px 0 2px;letter-spacing:.3px}
.qi .pm{flex:none;font-weight:400}
.qimg{display:block;max-width:100%;height:auto;margin:1px 0}
.swb{position:absolute;right:-34px;top:0;width:28px;height:28px;font-size:17px!important;border-radius:50%;border:2px solid #b45309;background:#fff7e0;color:#b45309;font:700 20px/1 Arial,sans-serif;cursor:pointer;padding:0}
.page[dir="rtl"] .swb{right:auto;left:-36px}
.pvin .page{overflow:visible}
.pvin.swm .qi[data-sw]{cursor:pointer;outline:2px dashed rgba(180,83,9,.45);outline-offset:1px;border-radius:4px;margin:2px 0}
.pvin.swm .qi[data-sw]:active{background:#fff3cd}
.bsum{font-size:16px;line-height:1.55;margin:6px 0 10px;padding:0 0 0 18px}.bsum li{margin:2px 0}
.gap{border-left:4px solid var(--gold);padding:8px 12px;background:var(--soft);border-radius:8px;font-size:15px;margin:8px 0}
.qi .n{flex:none;min-width:26px;font-weight:700}
.qi .tx{flex:1}
.ops{display:grid;gap:2px 10px;margin:1px 0 2px 32px}
.page[dir="rtl"] .ops{margin:1px 32px 2px 0}
.ops.c4{grid-template-columns:repeat(4,1fr)}.ops.c2{grid-template-columns:repeat(2,1fr)}.ops.c1{grid-template-columns:1fr}
.ops span b{font-weight:700;margin-inline-end:3px}
.lqs .qi{padding:6px 0}
.kt{font:800 20px/1.3 Georgia,serif;text-align:center;margin:6px 0 10px}
.kg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:12px}
.kg span{border:1px solid #000;border-radius:4px;padding:3px 6px;font:700 14px/1.3 Arial,sans-serif;text-align:center}
.page math{font-size:1.05em;direction:ltr;unicode-bidi:isolate}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff;padding:0}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 #printArea .page{margin:0;break-after:page;box-shadow:none}
 #printArea .page.half{break-after:auto}
 #printArea .page.half:nth-child(2n){break-after:page;border-top:1px dashed #999}
}
#printArea{display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;padding-bottom:2px}
.tab{flex:none;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:8px 14px;font:700 15px/1.2 var(--f-body);cursor:pointer}
.tab[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,193,7,.2)}
.tab b{background:var(--gold);color:#1a1300;border-radius:999px;padding:0 7px;margin-inline-start:4px}
.pf2{display:grid;grid-template-columns:1fr;gap:8px}
.srow{display:flex;gap:8px}.srow .inp{flex:1}
.ql{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.qrow{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--soft);cursor:pointer;font-size:16px;line-height:1.45}
.qrow.on{border-color:var(--gold);background:rgba(255,193,7,.12)}
.qrow input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:#e0a800}
.qrow .qt{flex:1;min-width:0;overflow-wrap:anywhere}
.qrow small{display:inline-block;color:var(--mut);font-size:12.5px;margin-inline-end:6px}
.qrow .qo{display:block;color:var(--mut);font-size:14px;margin-top:3px}
.qrow img{display:block;max-width:100%;height:auto;background:#fff;border-radius:6px;margin-top:4px}
.ql[dir="rtl"] .qrow{font:400 18px/1.9 var(--f-ur)}
.er{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line);padding:7px 0}
.er .et{flex:1 1 100%;min-width:0;font-size:15px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.er .eb{display:flex;gap:6px;flex:none;margin-inline-start:auto}
.er .eb button{width:38px;height:38px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;padding:0}
.ef{display:grid;gap:8px;margin:8px 0}
.ef label{font-weight:700;font-size:15px}
.ef label .u{font-weight:400;color:var(--mut);margin-inline-start:6px}
textarea.inp{min-height:80px;font-family:inherit}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.seg .ch{min-height:auto;padding:10px}
.prs{display:flex;flex-direction:column;gap:8px}
.prs .row{display:flex;gap:8px}.prs .row .ch{flex:1;min-height:auto}
.prs .row .btn{flex:none;min-height:auto;padding:8px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
/* half page (2 copies per A4) */
.page.half{height:561px;padding:16px 30px 22px;font-size:12.5px;line-height:1.32}
.page.half[dir="rtl"]{font-size:14.5px;line-height:1.6}
.page.half .ph{padding:5px 8px;margin-bottom:6px}
.page.half .ph img{width:40px;height:40px}
.page.half .ph .nm b{font-size:16px}
.page.half .ph .r2{font-size:13.5px;margin:2px 0}
.page.half .ph .r3{font-size:12px;padding-top:3px}
.page.half .ph .r4{margin-top:4px}.page.half .ph .r4 div{height:22px;font-size:11px}
.page.half .sh{font-size:13px;padding:3px 0 2px;margin:4px 0}
.page.half .qi{padding:1px 0}
.page.half .pf{bottom:5px;font-size:9px}
.ph .tch{font-size:12.5px;text-align:center;margin-top:2px}
</style>
</head>
<body>

  <a href="../#home" aria-label="AHSA Home"><img src="../assets/logo-96.webp" alt="" width="40" height="40"></a>
  <h1>Auto Paper Maker<small>آٹو پیپر میکر · خودکار ٹیسٹ پیپر</small></h1>
  <button class="ib" id="themeBtn" type="button" aria-label="Light or dark">◐</button>
</header>
<main id="app"></main>
<nav class="bnav" aria-label="Paper maker menu">
  <button type="button" data-go="gen"><span class="e">📝</span>Generate<span class="u">پیپر بنائیں</span></button>
  <button type="button" data-go="my"><span class="e">📂</span>My Papers<span class="u">میرے پیپرز</span></button>

</nav>
<div id="stage"></div>
<div id="printArea"></div>
<script>
(function(){try{var t=localStorage.getItem('ahsa-site-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}})();
const $=s=>document.querySelector(s);

function generate(){
  const k=key(), used=LS.get('ahsa-pm-used',{}), U=used[k]||{};
  const seed=(Date.now()^Math.floor(Math.random()*1e9))>>>0, r=rng(seed);
  const sec={}, short=[];
  TT.forEach(t=>{
    const c=S[t]; const pk=[...new Set(S.pick[t]||[])].filter(id=>S.ch.includes(+id.split(':')[0])&&getQ(id,t)); if(pk.length>c.n)c.n=pk.length;
    if(!c.n){sec[t]={mk:c.mk,ids:[]};return}
    const pool=[[],[],[]], pks=new Set(pk);
    PACK.u.forEach(u=>{if(!S.ch.includes(u.n))return;(u[t]||[]).forEach((q,i)=>{if(S.exd&&q.x)return;const id=u.n+':'+i;if(!pks.has(id))pool[q.d].push(id)})});
    const ut=usedSet(k,t);
    const order=a=>{const s=shuf(a,r);return s.filter(x=>!ut.has(x)).concat(s.filter(x=>ut.has(x)))};
    const P=pool.map(order); let want=c.mix&&!pk.length?[c.e,c.md,c.h]:null, got=pk.slice();
    if(want){want.forEach((w,i)=>{got=got.concat(P[i].splice(0,w))})}
    const rest=order(P.flat()); while(got.length<c.n&&rest.length)got.push(rest.shift());
    if(got.length<c.n)short.push(TYP[t][0]);
    // keep chapter order inside the paper
    got.sort((a,b)=>{const[x,y]=a.split(':').map(Number),[p,q]=b.split(':').map(Number);return x-p||y-q});
    sec[t]={mk:c.mk,ids:got};
    const all=new Set([...(U[t]||[]),...got]); let arr=[...all]; if(arr.length>4000)arr=arr.slice(-4000); U[t]=arr;
  });
  used[k]=U; LS.set('ahsa-pm-used',used);
  const tp=TPL.find(t=>t.k===S.tpl);
  const P=Object.assign({id:Date.now(),k,c:S.c,s:S.s,m:S.m,tpl:S.tpl,title:tp.en,titleUr:tp.ur,inst:S.inst||DEF_INST,time:S.time,pass:S.pass,ab:S.ab,seed,chs:S.ch.slice(),sec,date:new Date().toISOString().slice(0,10)},hdrOf());
  storeP(P);
  VP=Object.assign({saved:true},P);
  if(short.length)toast('Not enough questions for: '+short.join(', ')+' · جتنے سوال ملے، شامل کر دیے');
  SWM=false;EDM=false;ADDQ=null;view='paper';render();scrollTo(0,0);
}

async function makePDF(kind){
  busy(true,'⏳ PDF بن رہی ہے…<br>Making PDF…');

    await Promise.all(LIBS.map(load));

    await Promise.all([...st.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
    for(let i=0;i<els.length;i++){

}

// pick one question id of type t from chapters chs; avoids ids in ex; prefers unused and difficulty d
function pickQ(t,chs,ex,U,d,r,fallback){
  const cand=[];const use=new Set(U||[]);
  const add=f=>PACK.u.forEach(u=>{if(!f(u))return;(u[t]||[]).forEach((q,i)=>{const id=u.n+':'+i;if(q.x||ex.has(t+'|'+id))return;cand.push([id,q.d])})});
  add(u=>chs.includes(u.n));
  if(!cand.length&&fallback!==false){add(u=>u.n===0);if(!cand.length&&fallback==='any')add(()=>true)}
  if(!cand.length)return null;
  const s=shuf(cand,r); const sc=c=>(use.has(c[0])?2:0)+(d==null||c[1]===d?0:1);
  s.sort((a,b)=>sc(a)-sc(b)); return s[0][0];
}
const DSEQ=[0,1,2,1,0,1,2,0,1,1];
function boardPick(sc,r,U){
  const ex=new Set(); let k=0; const take=(t,chs,fb)=>{const id=pickQ(t,chs,ex,U[t],DSEQ[k++%DSEQ.length],r,fb);if(id)ex.add(t+'|'+id);return id};
  const mcq=[];Object.entries(sc.mcq).forEach(([c,n])=>{for(let i=0;i<n;i++){const id=take('mcq',[+c],'any');if(id)mcq.push(id)}});
  const sq=sc.sq.map(g=>{const a=[];const all=Object.keys(g.c).map(Number);Object.entries(g.c).forEach(([c,n])=>{for(let i=0;i<n;i++){const id=take('sq',[+c],false)||take('sq',all,true)||take('sq',[],'any');if(id)a.push(id)}});return a});
  const lq=LQS(sc).map(parts=>{let usedCh=null;return parts.map((chs,pi)=>{
    let L=shuf(chs,r); if(usedCh!=null&&L.length>1)L=L.filter(c=>c!==usedCh).concat([usedCh]);
    const wantNum=sc.lq.num===pi||(sc.lq.num==='opt'&&r()<.5);
    for(const c of L){if(wantNum){const id=take('num',[c],false);if(id){usedCh=c;return 'num|'+id}}const id=take('lq',[c],false);if(id){usedCh=c;return 'lq|'+id}}
    if(wantNum){const id=take('num',chs,false);if(id)return 'num|'+id}
    const id=take('lq',chs,true)||take('lq',[],'any');return id?'lq|'+id:null}).filter(Boolean)});
  return {mcq,sq,lq};
}

    const a=path.split('|');
    if(a[0]==='mcq'){const old=b.mcq[+a[1]];nid=pickQ('mcq',[+old.split(':')[0]],ex,U.mcq,null,r,false);if(nid)b.mcq[+a[1]]=nid}
    else if(a[0]==='sq'){const g=+a[1],i=+a[2],old=b.sq[g][i],ch=+old.split(':')[0];nid=pickQ('sq',[ch],ex,U.sq,null,r,false)||pickQ('sq',Object.keys(sc.sq[g].c).map(Number),ex,U.sq,null,r,true);if(nid)b.sq[g][i]=nid}
    else{const qi=+a[1],pi=+a[2],old=b.lq[qi][pi],[t,oid]=old.split('|'),ch=+oid.split(':')[0];
      nid=pickQ(t,[ch],ex,U[t],null,r,false)||pickQ(t,LQS(sc)[qi][pi],ex,U[t],null,r,t==='lq');if(nid){nid=t+'|'+nid;b.lq[qi][pi]=nid}}
    if(nid)markUsed(P.k,{mcq:a[0]==='mcq'?[nid]:[],sq:a[0]==='sq'?[[nid]]:[[]],lq:a[0]==='lq'?[[nid]]:[[]]});
  }else{const [t,i]=path.split('|');const ids=P.sec[t].ids;if(ids[+i].startsWith('c:')){if(!quiet)toast('This is your own question · یہ آپ کا اپنا سوال ہے');return false}ids.forEach(x=>ex.add(t+'|'+x));const old=ids[+i],ch=+old.split(':')[0];
    const q=getQ(old,t);nid=pickQ(t,[ch],ex,U[t],q&&q.d,r,false)||pickQ(t,P.chs,ex,U[t],q&&q.d,r,false);
    if(nid){ids[+i]=nid;const used=LS.get('ahsa-pm-used',{});const UU=used[P.k]||{};UU[t]=[...(UU[t]||[]),nid];used[P.k]=UU;LS.set('ahsa-pm-used',used)}}
  if(quiet)return !!nid;

  const {saved,...clean}=P; storeP(clean); const y=scrollY; await drawPreview(); scrollTo(0,y); toast('Question changed · سوال بدل دیا');
}

  const[T,pm]=totals(P); const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div role="dialog" aria-label="Paper info"><h2 class="q">Paper Info<span class="u">پیپر کی تفصیل</span></h2><dl>
   <dt>Type</dt><dd>${P.title}</dd><dt>Class</dt><dd>${CL[P.c][0]}</dd><dt>Subject</dt><dd>${SB[P.s][0]} (${P.m.toUpperCase()})</dd>
   <dt>Chapters</dt><dd>${P.bp?'Board scheme 2027':(P.chs.filter(n=>n<100).sort((a,b)=>a-b).join(', ')||'-')}</dd>
   ${P.bp?(()=>{const n=cnt(P);return `<dt>MCQs</dt><dd>${n.mcq}</dd><dt>Short</dt><dd>${n.sq}</dd><dt>Long</dt><dd>${n.lq}${n.num?' + '+n.num+' numericals':''}</dd>`})():TT.filter(t=>t!=='num'||SEC(P,t).ids.length).map(t=>`<dt>${TYP[t][0].replace(' Questions','')}</dt><dd>${SEC(P,t).ids.length} × ${SEC(P,t).mk}</dd>`).join('')}
   <dt>Total / Pass</dt><dd>${T} / ${pm} (${P.pass}%)</dd><dt>Time</dt><dd>${fmtTime(P.time)}</dd><dt>Sets</dt><dd>${P.ab?'A and B':'One'}</dd><dt>Made on</dt><dd>${P.date}</dd></dl>
   <div class="row"><button class="btn red" data-del="${P.id}" type="button">🗑 Delete</button><button class="btn line" data-close type="button" style="flex:1">Close</button></div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))m.remove();const d=e.target.closest('[data-del]');
    if(d){if(d.dataset.sure){LS.set('ahsa-papers',LS.get('ahsa-papers',[]).filter(x=>x.id!==P.id));m.remove();render();toast('Deleted · حذف ہو گیا')}else{d.dataset.sure=1;d.textContent='Tap again to delete · دوبارہ دبائیں'}}});
}
/* ---------------- events ---------------- */
function bump(id,dir){
  const [a,b]=id.split('.'); const A=avail(); const sum=x=>x[0]+x[1]+x[2];
  if(!b){S[a]=Math.max(a==='time'?5:1,Math.min(a==='time'?300:100,S[a]+dir*(a==='time'?5:1)));return}
  const c=S[a];
  if(b==='n'){c.n=Math.max(0,Math.min(sum(A[a]),c.n+dir));if(c.mix){c.mix=false}}
  else if(b==='mk'){c.mk=Math.max(1,Math.min(20,c.mk+dir))}
  else{const i={e:0,md:1,h:2}[b];c[b]=Math.max(0,Math.min(A[a][i],c[b]+dir));c.n=c.e+c.md+c.h}
}
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]'); if(g){if(g.dataset.go==='gen'&&view==='gen'){step=1}go(g.dataset.go);return}
  const qs=SWM&&e.target.closest('#pvin .qi[data-sw]'); if(qs){swapQ(qs.dataset.sw);return}
  const b=e.target.closest('button'); if(!b)return;
  if(b.id==='themeBtn'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('ahsa-site-theme',r.dataset.theme)}catch(x){}return}
  if(b.hasAttribute('data-gopick')){S.inst=($('#inst')||{}).value?.trim()||S.inst;save();PF.ch='';PF.q='';PF.lim=30;go('pick');return}
  if(b.dataset.pt){PF.t=b.dataset.pt;PF.lim=30;const y=scrollY;await render();scrollTo(0,y);return}
  if(b.hasAttribute('data-pfs')){PF.q=$('#pfq').value;PF.lim=30;await render();return}
  if(b.hasAttribute('data-pmore')){PF.lim+=30;const y=scrollY;await render();scrollTo(0,y);return}
  if(b.hasAttribute('data-pclear')){S.pick={mcq:[],sq:[],lq:[],num:[]};save();const y=scrollY;await render();scrollTo(0,y);toast('Picks cleared · انتخاب ختم');return}
  if(b.hasAttribute('data-pdone')){TT.forEach(t=>{if(S[t].n<S.pick[t].length)S[t].n=S.pick[t].length});save();step=5;go('gen');return}
  if(b.dataset.pload){const L=LS.get('ahsa-pm-presets',[]),x=L[+b.dataset.pload];if(x){Object.assign(S,JSON.parse(JSON.stringify(x.S)));S.pick={mcq:[],sq:[],lq:[],num:[]};save();step=5;render();scrollTo(0,0);toast('Preset loaded · ترتیب لوڈ ہو گئی')}return}
  if(b.dataset.pdel){if(b.dataset.sure){const L=LS.get('ahsa-pm-presets',[]);L.splice(+b.dataset.pdel,1);LS.set('ahsa-pm-presets',L);render()}else{b.dataset.sure=1;b.textContent='✓?';toast('Tap again to delete · دوبارہ دبائیں')}return}
  if(b.hasAttribute('data-psave')){const nm=($('#pname').value||'').trim();if(!nm){toast('Write a name first · پہلے نام لکھیں');$('#pname').focus();return}
    S.inst=($('#inst')||{}).value?.trim()||S.inst;const{pick,...snap}=S;const L=LS.get('ahsa-pm-presets',[]).filter(x=>x.name!==nm);L.unshift({name:nm,S:JSON.parse(JSON.stringify(snap))});LS.set('ahsa-pm-presets',L.slice(0,20));toast('Preset saved · ترتیب محفوظ ہو گئی');$('#pname').value='';return}
  if(b.dataset.half){if(view==='paper'&&VP){VP.half=b.dataset.half==='1';await saveEdit(true)}else{S.half=b.dataset.half==='1';save();const y=scrollY;await render();scrollTo(0,y)}return}
  if(b.hasAttribute('data-logodel')){LS.set('ahsa-pm-logo',null);try{localStorage.removeItem('ahsa-pm-logo')}catch(x){}const y=scrollY;await render();scrollTo(0,y);return}
  if(b.dataset.em){const[a,t,i]=b.dataset.em.split('|');editAct(a,t,+i);return}
  if(b.dataset.einc||b.dataset.edec){const id=b.dataset.einc||b.dataset.edec,d=b.dataset.einc?1:-1,[a,k]=id.split('.');
    if(k){VP.sec[a]=VP.sec[a]||{mk:1,ids:[]};VP.sec[a].mk=Math.max(1,Math.min(20,VP.sec[a].mk+d))}else if(a==='time')VP.time=Math.max(5,Math.min(300,VP.time+d*5));else VP.pass=Math.max(1,Math.min(100,VP.pass+d));
    await saveEdit(true);return}
  if(b.dataset.addq!=null){ADDQ=b.dataset.addq||null;const y=scrollY;await render();scrollTo(0,y);if(ADDQ)$('#aq_q').focus();return}
  if(b.dataset.addsave){if(addCustom(b.dataset.addsave)){ADDQ=null;await saveEdit(true);toast('Question added · سوال شامل ہو گیا')}return}
  if(b.dataset.dup){const P=LS.get('ahsa-papers',[]).find(x=>x.id==b.dataset.dup);if(P){const C=JSON.parse(JSON.stringify(P));C.id=Date.now();C.date=new Date().toISOString().slice(0,10);C.ctitle=(P.ctitle||(P.m==='um'?P.titleUr:P.title))+' (copy)';storeP(C);VP=Object.assign({saved:true},C);EDM=true;view='paper';render();scrollTo(0,0);toast('Copy made. Edit it now · کاپی بن گئی، اب تبدیلی کریں')}return}
  if(b.dataset.c){if(S.c!==b.dataset.c){S.c=b.dataset.c;S.s=null;S.m=null;S.ch=[];S.pick={mcq:[],sq:[],lq:[],num:[]}}step=2;save();render();scrollTo(0,0);return}
  if(b.dataset.s){if(S.s!==b.dataset.s){S.s=b.dataset.s;S.m=null;S.ch=[];S.pick={mcq:[],sq:[],lq:[],num:[]}}save();render();return}
  if(b.dataset.m){if(S.m!==b.dataset.m)S.pick={mcq:[],sq:[],lq:[],num:[]};S.m=b.dataset.m;S.ch=[];save();render();return}
  if(b.dataset.step){step=+b.dataset.step;if(step===3&&!S.ch.length){S.ch=IDX[key()].u.map(u=>u[0]).slice(0,1)}save();render();scrollTo(0,0);return}
  if(b.dataset.tpl){S.tpl=b.dataset.tpl;if(S.tpl!=='bp'){const t=TPL.find(x=>x.k===S.tpl);S.time=t.time;['mcq','sq','lq'].forEach(k=>{S[k].n=t[k][0];S[k].mk=t[k][1];S[k].mix=false});S.num.n=0;S.num.mix=false}step=5;save();render();scrollTo(0,0);return}
  if(b.dataset.board){if(b.dataset.board==='fb'){toast('Federal Board scheme coming soon · فیڈرل بورڈ جلد آ رہا ہے');return}S.board=b.dataset.board;save();render();return}
  if(b.dataset.sw){swapQ(b.dataset.sw);return}
  if(b.dataset.inc||b.dataset.dec){bump(b.dataset.inc||b.dataset.dec,b.dataset.inc?1:-1);save();const y=scrollY;await render();scrollTo(0,y);return}
  if(b.id==='genBtn'){S.inst=($('#inst').value||'').trim()||DEF_INST;LS.set('ahsa-pm-inst',S.inst);save();busy(true,'⏳');try{await getPack(key());S.tpl==='bp'?genBoard():generate()}finally{busy(false)}return}
  if(b.dataset.act){if(b.dataset.act==='again'){if(VP){S.c=VP.c;S.s=VP.s;S.m=VP.m;if(VP.bp)S.tpl='bp';save()}step=5;view='gen';render();scrollTo(0,0);return}if(b.dataset.act==='regen'){regen();return}if(b.dataset.act==='edm'){EDM=!EDM;SWM=false;ADDQ=null;await render();if(EDM)$('#edp').scrollIntoView({behavior:'smooth'});return}if(b.dataset.act==='swm'){SWM=!SWM;EDM=false;const y=scrollY;await render();scrollTo(0,y);if(SWM)toast('Tap a question in the paper · پیپر میں سوال پر ٹیپ کریں');return}act(b.dataset.act,VP);return}
  if(b.dataset.pv){const P=LS.get('ahsa-papers',[]).find(x=>x.id==b.dataset.pv);if(P){VP=Object.assign({saved:true},P);view='paper';render();scrollTo(0,0)}return}
  if(b.dataset.pa){const[a,id]=b.dataset.pa.split('|');const P=LS.get('ahsa-papers',[]).find(x=>x.id==id);if(P)act(a,P);return}
  if(b.dataset.info){const P=LS.get('ahsa-papers',[]).find(x=>x.id==b.dataset.info);if(P)info(P);return}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='chAll'){S.ch=t.checked?IDX[key()].u.map(u=>u[0]):[];save();render();return}
  if(t.dataset.chn){const n=+t.dataset.chn;S.ch=t.checked?[...new Set([...S.ch,n])]:S.ch.filter(x=>x!==n);save();const y=scrollY;render().then(()=>scrollTo(0,y));return}
  if(t.dataset.mix){const c=S[t.dataset.mix];c.mix=t.checked;if(c.mix){const A=avail()[t.dataset.mix];let n=c.n;c.e=Math.min(A[0],Math.round(n*.4));c.h=Math.min(A[2],Math.round(n*.2));c.md=Math.min(A[1],n-c.e-c.h);c.n=c.e+c.md+c.h}save();const y=scrollY;render().then(()=>scrollTo(0,y));return}
  if(t.dataset.opt){S[t.dataset.opt]=t.checked;save();const y=scrollY;render().then(()=>scrollTo(0,y));return}
  if(t.id==='inst'){S.inst=t.value.trim()||DEF_INST;save()}
  if(t.id==='lastN'){S.lastN=t.value;save();return}
  if(t.id==='ttl'||t.id==='tch'||t.id==='dstr'){S[t.id]=t.value.trim();save();return}
  if(t.id==='pfch'){PF.ch=t.value;PF.lim=30;render();return}
  if(t.id==='pfq'){PF.q=t.value;PF.lim=30;render();return}
  if(t.dataset.pk){const[ty,id]=t.dataset.pk.split('|');const a=S.pick[ty];const j=a.indexOf(id);if(t.checked&&j<0)a.push(id);if(!t.checked&&j>=0)a.splice(j,1);save();
    t.closest('.qrow').classList.toggle('on',t.checked);const c=$('#pc-'+ty);if(c)c.textContent=a.length;$('#ptot').textContent=TT.reduce((x,k)=>x+S.pick[k].length,0);return}
  if(t.dataset.ef&&VP){const k=t.dataset.ef;VP[k]=k==='inst'?(t.value.trim()||DEF_INST):t.value.trim();saveEdit(false);return}
  if(t.dataset.ins&&VP){VP.ins=VP.ins||{};VP.ins[t.dataset.ins]=t.value.trim();saveEdit(false);return}
  if(t.hasAttribute('data-eab')&&VP){VP.ab=t.checked;saveEdit(true);return}
  if(t.id==='logoIn'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=128;c.width=c.height=z;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,z,z);const k=Math.min(z/im.width,z/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(z-w)/2,(z-h)/2,w,h);LS.set('ahsa-pm-logo',c.toDataURL('image/png'));const y=scrollY;render().then(()=>scrollTo(0,y));toast('Logo saved · لوگو محفوظ ہو گیا')};im.src=fr.result};fr.readAsDataURL(t.files[0]);return}
});
function fitPreview(){const w=$('#pvw'),inn=$('#pvin');if(!w||!inn)return;inn.style.width='794px';const sc=Math.min(1,(w.clientWidth-20)/794);inn.style.transform=`scale(${sc})`;w.style.height=(inn.scrollHeight*sc+20)+'px'}
addEventListener('resize',()=>{if(view==='paper')fitPreview()});
if(location.hash==='#my')view='my';if(location.hash==='#cov')view='cov';
if(S.c&&S.s&&S.m)step=S.ch.length?5:3;else if(S.c)step=2;
render().catch(()=>{$('#app').innerHTML='<div class="card warn">Could not load. Check internet and refresh. · انٹرنیٹ چیک کر کے دوبارہ کھولیں۔</div>'});
</script>
